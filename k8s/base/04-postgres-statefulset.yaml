apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: pet-adopt-dev
  labels:
    app: postgres
spec:
  serviceName: postgres-service # statefulset için headless service'i kullanıyorum.
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-adopt-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-adopt-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD_FILE
              value : /run/secrets/postgres_password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pg-data
            - name: postgres-secrets
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - petadmin
            initialDelaySeconds: 10
            periodSeconds: 10

