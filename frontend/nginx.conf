server {
    # listen 8080 for HTTP requests in the frontend container
    listen 8080;
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    # reverse proxy for the backend API
    location /api/ {
        proxy_pass http://backend-service:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # reverse proxy for the backend uploads routing this uploads to the backend container
    location /uploads/ {
    proxy_pass http://backend-service:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

    location = /stub_status {
        stub_status;
        allow 172.16.0.0/12; # docker internal ip range
        deny all;
    }
}
