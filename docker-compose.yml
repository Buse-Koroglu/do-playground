services:
  db:
    image: postgres:15-alpine
    container_name: pet_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    restart: unless-stopped
    secrets:
      - postgres_password

  backend:
    build: ./backend
    container_name: backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_NAME: ${POSTGRES_DB}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      PORT: 5000
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT}
    ports:
      - "${BACKEND_PORT}:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
      - frontend_net
      - monitoring_net
    restart: unless-stopped
    secrets:
      - jwt_secret
      - postgres_password

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: frontend
    ports:
      - "${FRONTEND_PORT}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend_net

  postgres-exporter:
    build: ./monitoring/postgres-exporter
    container_name: postgres-exporter
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_NAME: ${POSTGRES_DB}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
    networks:
      - monitoring_net # prometheus'un db'yi görebilmesi için monitoring_net'e ekledik
      - backend_net # db'ye erişebilmek için backend_net'e de ekledik      
    secrets:
      - postgres_password
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - '-nginx.scrape-uri=http://frontend:8080/stub_status' # main command : nginx'in stub_status endpoint'ini kullanarak metrikleri alıyoruz
    networks:
      - monitoring_net
      - frontend_net
    depends_on:
      - frontend
    restart: unless-stopped  


volumes:
  postgres_data:

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret
  postgres_password:
    file: ./secrets/postgres_password

networks:
  backend_net:
  frontend_net:
  monitoring_net:
